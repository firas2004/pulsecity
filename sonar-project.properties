# ── PulseCity SonarQube Configuration ──────────────────────────────────────────
sonar.projectKey=pulsecity
sonar.projectName=PulseCity - Smart City Platform
sonar.projectVersion=2.0

# Sources and Tests
sonar.sources=backend-v2,frontend/src,iot-simulator,anomaly-detector
sonar.tests=backend-v2/tests,iot-simulator/tests,anomaly-detector/tests

# Encodage
sonar.sourceEncoding=UTF-8

# Inclusions / Exclusions
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/build/**,**/*.db,**/*.pyc,**/figures/**,**/docs/**,**/public/**,**/*.png,**/*.jpg,**/*.mp4,**/*.pdf
sonar.test.inclusions=**/test_*.py,**/*_test.py,**/*.spec.js,**/*.test.jsx

# Python specifics & Coverage reports
sonar.python.version=3.11
sonar.python.coverage.reportPaths=reports/coverage-backend.xml,reports/coverage-simulator.xml,reports/coverage-detector.xml
sonar.python.xunit.reportPath=reports/pytest-*.xml

# Quality Gate
sonar.qualitygate.wait=true

